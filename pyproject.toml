[project]
name = "gpt-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "tensorflow>=2.21.0",
    "tiktoken>=0.14.0",
    "torch>=2.0",
    "tqdm>=4.70.1",
]

[project.scripts]
gpt-learn = "gpt_learn:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
